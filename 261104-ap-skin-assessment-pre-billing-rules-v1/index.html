<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Skin Assessment Pre-Billing Audit — Prototype v1</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    .filters { flex-wrap: nowrap; gap: 12px; }
    .filters .input, .filters .select { width: 128px; }
    .filters .f-wide .input { width: 170px; }
    .filters .f-mid .select { width: 120px; }
    .doc { color: var(--blu); display: inline-flex; }
    .doc svg { width: 14px; height: 14px; }
    .sort { color: var(--gra-text-1); font-size: 9px; margin-left: 3px; }
    .st { display: inline-block; min-width: 150px; padding: 3px 10px; border-radius: 10px; font-size: 12px; }
    .req { display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
<main>
  <div class="page-header">
    <h1 class="page-title">Skin Assessment Pre-Billing Audit</h1>
    <div class="page-actions">
      <button class="btn" type="button" id="back"></button>
      <a class="btn btn--primary" href="rules.html">Manage rules</a>
    </div>
  </div>
  <section class="panel">
    <div class="panel__bar">Search</div>
    <form class="filters" onsubmit="return false">
      <div class="field"><label class="field-label" for="f1">From DOS</label><input class="input" id="f1" type="date" value="2026-11-14"></div>
      <div class="field"><label class="field-label" for="f2">To DOS</label><input class="input" id="f2" type="date" value="2026-11-14"></div>
      <div class="field f-wide"><label class="field-label" for="f3">Clinician</label><input class="input" id="f3"></div>
      <div class="field f-wide"><label class="field-label" for="f4">Facility</label><input class="input" id="f4"></div>
      <div class="field f-wide"><label class="field-label" for="f5">Patient</label><input class="input" id="f5"></div>
      <div class="field f-mid"><label class="field-label" for="f6">Status</label><select class="select" id="f6"><option></option><option>Pending review</option><option>Needs CPT update</option><option>Released - CPT unchanged</option><option>Released - CPT updated</option></select></div>
      <div class="field f-mid"><label class="field-label" for="f7">Request Type</label><select class="select" id="f7"><option></option><option>Clinician request</option><option>Audit rule</option></select></div>
      <button class="btn btn--primary" type="button" id="search"></button>
      <button class="btn" type="button" id="reset"></button>
    </form>
    <div class="table-head"><h2 class="section-title">Audit Details</h2><button class="btn btn--primary" type="button" id="dl"></button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Action</th><th>DOS <span class="sort">&#9650;&#9660;</span></th><th>Clinician <span class="sort">&#9650;&#9660;</span></th><th>Facility <span class="sort">&#9650;&#9660;</span></th><th>Patient <span class="sort">&#9650;&#9660;</span></th><th>Note <span class="sort">&#9650;&#9660;</span></th><th>CPT <span class="sort">&#9650;&#9660;</span></th><th>Request Type <span class="sort">&#9650;&#9660;</span></th><th>Status <span class="sort">&#9650;&#9660;</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="shared.js"></script>
<script>
  mountChrome();
  $('back').innerHTML = ICON.back + ' Back';
  $('search').innerHTML = ICON.search + ' Search';
  $('reset').innerHTML = ICON.reset + ' Reset';
  $('dl').innerHTML = ICON.download + ' Download Excel';
  const DOC = '<span class="doc"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1h6l4 4v10H3V1zm6 0v4h4"/></svg></span>';
  const EDIT = '<span class="icon-btn" title="Review visit"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 11.5V14h2.5l7.4-7.4-2.5-2.5L2 11.5zM13.7 4.8a.7.7 0 0 0 0-1l-1.5-1.5a.7.7 0 0 0-1 0l-1.2 1.2 2.5 2.5 1.2-1.2z"/></svg></span>';
  /* Placeholder visits (not part of this change) */
  const V = [
    ['Elijah Torres', 'CC Young', 'Clinician request', 'Pending review', 'pill--pending'],
    ['George O\'Malley', 'Blue ridge healthcare', 'Audit rule', 'Pending review', 'pill--pending'],
    ['Elijah Torres', 'Blue ridge healthcare', 'Clinician request', 'Needs CPT update', 'pill--needs'],
    ['Jake Karev', 'CC Young', 'Clinician request', 'Released - CPT unchanged', 'pill--released'],
    ['Elijah Torres', 'CC Young', 'Audit rule', 'Released - CPT updated', 'pill--released']
  ];
  $('rows').innerHTML = V.map(v => `<tr><td>${EDIT}</td><td>07/15/26</td><td>${esc(v[0])}</td><td>${esc(v[1])}</td><td><a href="#">Olivia bennett</a></td><td>${DOC}</td><td>11042</td>
    <td><span class="req">${v[2]}${v[2] === 'Audit rule' ? '<span class="info" tabindex="0">i<span class="tip">Held by rule: ["Rule name"]</span></span>' : ''}</span></td>
    <td><span class="pill st ${v[4]}">${v[3]}</span></td></tr>`).join('');
</script>
</body>
</html>
