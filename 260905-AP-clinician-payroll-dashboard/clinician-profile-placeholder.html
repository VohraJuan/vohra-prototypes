<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Clinician Profile — Placeholder</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Roboto', sans-serif; background: #eef5fd; color: #2f3c48; }
    .bar { height: 70px; background: linear-gradient(90deg, #013667 0%, #01427c 55%, #0a5a9c 100%); border-top: 3px solid #4a9edb; }
    .wrap { max-width: 640px; margin: 60px auto; background: #fff; border-radius: 4px; box-shadow: 0 0 4px rgba(0,0,0,.18); padding: 28px 32px; }
    h1 { font-family: 'Roboto Condensed', sans-serif; color: #006ab5; text-transform: uppercase; font-size: 26px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #4a627a; margin: 0; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="wrap">
    <h1 id="n">Clinician profile</h1>
    <p>Placeholder for the clinician's existing Admin Portal profile page. In the real page, this link opens that profile in a new tab.</p>
  </div>
  <script>
    const n = new URLSearchParams(location.search).get('name');
    if (n) { document.getElementById('n').textContent = n; document.title = n + ' — Profile'; }
  </script>
</body>
</html>
